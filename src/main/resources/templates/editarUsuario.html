
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Usuário</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        .form-container {
            background: white;
            max-width: 450px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #0002;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin: 12px 0 5px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background: #2196F3;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1976D2;
        }

        .voltar {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #2196F3;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h1>Editar Usuário</h1>

    <form th:action="@{/cadastro/ui/atualizar/{id}(id=${usuario.id})}"
          th:object="${usuario}"
          method="post">

        <label for="nome">Nome:</label>
        <input type="text" id="nome"
               th:field="*{nome}" required>

        <label for="email">Email:</label>
        <input type="email" id="email"
               th:field="*{email}" required>

        <label for="fone">Telefone:</label>
        <input type="text" id="fone"
               th:field="*{fone}" required>

        <label for="fone2">Telefone 2:</label>
        <input type="text" id="fone2"
               th:field="*{fone2}">

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco"
               th:field="*{endereco}" required>

        <button type="submit">Atualizar Usuário</button>

    </form>

    <a class="voltar"
       th:href="@{/cadastro/ui/listar}">
        Voltar
    </a>

</div>

</body>
</html>
